name: Build P22H190 kernel

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: p22h190-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ARCH: arm64
      SUBARCH: arm64
      DEFCONFIG: ums512-p22h190_defconfig
      CLANG_TRIPLE: aarch64-linux-gnu-
      CROSS_COMPILE: aarch64-linux-gnu-
      BUILD_DIR: ${{ github.workspace }}/out/ums512-p22h190
      RELEASE_DIR: ${{ github.workspace }}/out/release
      ANYKERNEL_DIR: ${{ github.workspace }}/out/AnyKernel3
      KPM_PATCHER: ${{ github.workspace }}/out/tools/patch_linux
      SOCKO_TEMPLATE: ${{ github.workspace }}/prebuilts/p22h190/socko.factory.img

    steps:
      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch Google Android clang r383902
        shell: bash
        run: |
          set -euo pipefail
          CLANG_ROOT="$RUNNER_TEMP/clang-r383902"
          CLANG_DIR="$CLANG_ROOT/clang-r383902/bin"
          CLANG_REPO="$RUNNER_TEMP/clang-repo"
          mkdir -p "$CLANG_ROOT" out
          git clone --depth=1 --filter=blob:none --sparse \
            --branch android12-release \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            "$CLANG_REPO"
          git -C "$CLANG_REPO" sparse-checkout set clang-r383902
          cp -a "$CLANG_REPO/clang-r383902" "$CLANG_ROOT/"
          test -x "$CLANG_DIR/clang"
          test -x "$CLANG_DIR/ld.lld"
          "$CLANG_DIR/clang" --version | tee out/clang-version.txt
          grep -F 'b397f81060ce6d701042b782172ed13bee898b79' out/clang-version.txt
          printf 'CLANG_DIR=%s\n' "$CLANG_DIR" >> "$GITHUB_ENV"

      - name: Install build and packaging dependencies
        run: |
          set -euo pipefail
          # GitHub's mirror list occasionally prioritizes an unreachable Azure
          # mirror. Keep the upstream archive candidate and bound retries.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '\|azure\.archive\.ubuntu\.com/ubuntu|d' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 install -y \
            bc bison cpio device-tree-compiler e2fsprogs fuse2fs flex fuse3 \
            gcc-aarch64-linux-gnu git kmod libelf-dev libncurses-dev \
            libssl-dev libyaml-dev lld perl python3 rsync unzip zip

      - name: Fetch KPM patcher and AnyKernel3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/tools
          curl -fL --retry 3 --connect-timeout 15 --max-time 180 \
            https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/main/kpm/patch_linux \
            -o "$KPM_PATCHER"
          echo '1bd00563e9d8fbbd11a16c0c1c59c5add406e6c5c92557def50f93d6f0aebe2d  out/tools/patch_linux' \
            | sha256sum --check
          chmod 755 "$KPM_PATCHER"
          file "$KPM_PATCHER"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git "$ANYKERNEL_DIR"
          test -f "$ANYKERNEL_DIR/anykernel.sh"

      - name: Build kernel, modules, AnyKernel3 and socko
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          ANDROID_CLANG_DIR="$CLANG_DIR" \
          P22H190_BUILD_DIR="$BUILD_DIR" \
          P22H190_OUTPUT_DIR="$RELEASE_DIR" \
          SOCKO_TEMPLATE="$SOCKO_TEMPLATE" \
          ANYKERNEL_DIR="$ANYKERNEL_DIR" \
          KPM_PATCHER="$KPM_PATCHER" \
          JOBS="$(nproc)" \
            ./scripts/build-p22h190.sh all 2>&1 | tee out/build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify release outputs
        shell: bash
        run: |
          set -euo pipefail
          ls -lh out/release
          test -s out/release/socko.img
          test -n "$(find out/release -maxdepth 1 -name 'AnyKernel3-P22H190-*.zip' -size +1c -print -quit)"
          sha256sum out/release/*.img out/release/*.zip | tee out/release/SHA256SUMS

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p22h190-build-log-${{ github.sha }}
          path: |
            out/build.log
            out/clang-version.txt
          if-no-files-found: warn

      - name: Upload build package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p22h190-packages-${{ github.sha }}
          path: |
            out/release/*.zip
            out/release/*.img
            out/release/SHA256SUMS
          if-no-files-found: warn
          compression-level: 0

      - name: Create GitHub Release
        if: github.event_name != 'pull_request' && success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: p22h190-${{ github.sha }}-${{ github.run_number }}
          name: P22H190 kernel ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            out/release/*.zip
            out/release/*.img
            out/release/SHA256SUMS
